    html, body {

    /* ── NAV ── */
    #mytopnav {

      top: 0; left: 0; right: 0;

      align-items: center;
      gap: 7px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255,255,255,0.6);
      letter-spacing: 0.01em;
    }
    .title img {
      width: 18px; height: 18px;
      border-radius: 50%;
      opacity: 0.7;
    }

    .btn-main {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 300;
      cursor: pointer;
      transition: color 0.15s, text-shadow 0.15s;
      letter-spacing: 0.01em;
    }
    .btn-main i { font-size: 13px; }
    .btn-main:hover,
    .btn-main.active {
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255,255,255,0.9);
    }

    /* ── MAIN ── */
    .main-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 100px 24px 80px;
  }

    /* ── SEARCH ── */
    .search-wrap {
      width: 100%;
      max-width: 480px;
    }

    #searchForm { position: relative; }

    .search-icon-wrap {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.25);
      font-size: 14px;
      pointer-events: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    #searchForm:focus-within .search-icon-wrap {
      color: rgba(255,255,255,0.7);
      text-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    #searchApps {
      width: 100%;
      padding: 13px 16px 13px 40px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 10px;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      text-shadow: 0 0 8px rgba(255,255,255,0.3);
    }
    #searchApps::placeholder {
      color: rgba(255,255,255,0.2);
      text-shadow: none;
    }
    #searchApps:focus {
      border-color: rgba(255,255,255,0.2);
      background: #2e2e2e;
      box-shadow: 0 0 20px rgba(255,255,255,0.04);
    }

    /* ── CONTEXT MENU ── */
    .context-menu {
      position: fixed;
      background: #252525;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 5px;
      min-width: 170px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      z-index: 9999;
      display: none;
      font-family: 'Inter', sans-serif;
    }
    .context-menu-item {
      padding: 8px 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 300;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.12s, color 0.12s, text-shadow 0.12s;
    }
    .context-menu-item:hover {
      background: #2e2e2e;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255,255,255,0.4);
    }
    .context-menu-item i { font-size: 13px; }
    .context-submenu {
      padding-left: 8px;
      display: none;
      border-left: 1px solid #333;
      margin: 2px 0 2px 10px;
    }
    .context-submenu.open { display: block; }
    .with-submenu::after {
      content: '\F285';
      font-family: 'bootstrap-icons';
      margin-left: auto;
      font-size: 10px;
      opacity: 0.3;
    }

    /* ── APPS GRID ── */
    .search-results {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1em;

    #searchMessage,

      color: rgba(255,255,255,0.25);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      letter-spacing: 0.03em;
      margin: 20px 0;
    }
  </style>
